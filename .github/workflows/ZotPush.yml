name: ZotPush
run-name: Deploy version ${{ inputs.version }} to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: "Version to deploy"
        required: true
      environment:
        type: environment
        description: "Target environment"
        required: true

permissions:
  contents: read
  packages: read

jobs:
  pull-push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.version }}-${{ inputs.environment }}-pull-push
      cancel-in-progress: true
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Zot
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ${{ secrets.ZOT_URL }}
          username: ${{ secrets.ZOT_USER }}
          password: ${{ secrets.ZOT_PASSWORD }}
      - name: Pull from GHCR, tag for Zot, and push
        env:
          ZOT_URL: ${{ secrets.ZOT_URL }}
          ZOT_REPOSITORY: ${{ vars.ZOT_REPOSITORY || 'oracles-iot/hpr' }}
        run: |
          set -euo pipefail
          SRC="ghcr.io/${{ github.repository }}:${{ inputs.version }}"
          DST="${ZOT_URL}/${ZOT_REPOSITORY}:${{ inputs.version }}"

          echo "Pulling $SRC"
          docker pull "$SRC"

          echo "Tagging $SRC -> $DST"
          docker tag "$SRC" "$DST"

          echo "Pushing $DST"
          docker push "$DST"
